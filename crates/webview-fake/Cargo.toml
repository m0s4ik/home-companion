[package]
name = "webview-fake"
description = "Test producer for the web view protocol: GBM buffers on the render node with a moving pattern drawn by GLES2, sent as dma-buf at ~30 fps"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
webview-proto = { path = "../webview-proto" }
libc = "0.2"
# The same versions Slint's linuxkms backend already uses (Cargo.lock); no Wayland import.
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
drm = "0.14"
