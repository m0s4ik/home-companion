[package]
name = "wakeword"
description = "microWakeWord v2 models on TensorFlow Lite Micro: a streaming detector with ESPHome's rules"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "wakeword-run"
path = "src/bin/wakeword_run.rs"

[dependencies]
hound = "3.5.1"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
cc = "1.11"
