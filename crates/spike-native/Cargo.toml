[package]
name = "spike-native"
description = "M0 spike: TensorFlow Lite Micro + microfrontend (microWakeWord) and libvosk linked into Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mww"
path = "src/bin/mww.rs"

[[bin]]
name = "vosk-grammar"
path = "src/bin/vosk_grammar.rs"

[dependencies]
hound = "3.5.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1.11"
