[package]
name = "brain"
description = "home-companion-brain: tools over MCP for Home Assistant's own AI (memory, reminders, timers, alarms, the house with gates), long-term memory on the device"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "home-companion-brain"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
log = { version = "0.4", features = ["kv_std"] }
# SQLite with FTS5, compiled in (the device has no libsqlite3)
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"
# The yes/no words of the reflex grammar (pure Rust: libc, serde, serde_json, toml, which the
# brain has already; libvosk only behind the reflex crate's own `vosk` feature).
reflex = { path = "../reflex" }
