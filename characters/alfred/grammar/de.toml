# Alfred's reflexes in German; see it.toml for the format. Slots:
# {duration} ("zehn minuten", "anderthalb stunden"), {time} ("um sieben uhr dreißig", "um halb sieben
# abends"), {percent} ("fünfzig prozent", "fünfzig"), {whole_duration} ({duration} in whole minutes
# up to three hours), {name:<key>} (a timer name of [timer_names] in the form <key>).
# Lower case, as Vosk writes it; every word is in vosk-model-small-de-0.15's vocabulary. The polite alarm forms
# ("stelle einen wecker", "wecke mich") are left out: the phrase list stays under 30000.
format = 1
language = "de"

