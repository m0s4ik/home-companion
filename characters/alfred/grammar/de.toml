# The timers a name can be given by voice ("stell einen timer für nudeln auf zehn minuten"). A closed
# grammar takes no free words, so the names are a list; edit it freely (the key = what the screen
# shows).
[timer_names]
Nudeln = { bare = "nudeln" }
Eier = { bare = "eier" }
Ofen = { bare = "ofen" }
Pizza = { bare = "pizza" }
Reis = { bare = "reis" }
