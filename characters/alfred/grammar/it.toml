#
# Alfred's reflexes in Italian: what the body does by itself, without
# Home Assistant, when Vosk hears exactly one of these phrases. Slots: {duration} ("dieci minuti",
# "un minuto e mezzo", "un'ora"), {time} ("alle sette e mezza", "all'una di notte"), {percent}
# ("cinquanta per cento", "cinquanta"); their words are in crates/reflex/src/slots.rs. Anything
# else ("accendi la luce", "che tempo fa") goes to the brain. {whole_duration} is {duration} in
# whole minutes up to three hours (used where another slot multiplies the phrases); {name:<key>}
# is a timer name of [timer_names] in the form <key>: label = what the screen shows. Every word must be in the Vosk
# model's vocabulary: Vosk logs "missing in vocabulary" for any that is not (journalctl -u home-companion).
format = 1
language = "it"

[commands]
time = ["che ore sono", "che ora è", "dimmi l'ora", "mi dici l'ora", "sai che ore sono"]
timer_start = [
    "metti un timer di {duration}",
    "metti un timer da {duration}",
    "metti un timer tra {duration}",
    "metti un timer fra {duration}",
    "imposta un timer tra {duration}",
    "timer tra {duration}",
    "imposta un timer di {duration}",
    "avvia un timer di {duration}",
    "fai partire un timer di {duration}",
    "timer di {duration}",
    "timer da {duration}",
    "timer {duration}",
    "imposta timer {duration}",
    "imposta il timer {duration}",
    "imposta un timer {duration}",
    "imposta timer di {duration}",
    "imposta il timer a {duration}",
    "metti timer {duration}",
    "metti il timer {duration}",
    "metti un timer {duration}",
    "metti timer di {duration}",
    "un timer di {duration}",
    "timer {name:bare} {whole_duration}",
    "timer {name:of} {whole_duration}",
    "metti un timer per {name:the} di {whole_duration}",
]
timer_cancel = [
    "annulla il timer",
    "cancella il timer",
    "togli il timer",
    "ferma il timer",
    "spegni il timer",
    "annulla i timer",
    "cancella i timer",
    "togli i timer",
    "interrompi il timer",
    "interrompi timer",
    "ferma timer",
    "annulla timer",
    "togli timer",
    "cancella timer",
    "spegni timer",
    "elimina il timer",
    "elimina timer",
    "stop timer",
    "annulla il timer {name:of}",
    "cancella il timer {name:of}",
    "togli il timer {name:of}",
    "ferma il timer {name:of}",
    "spegni il timer {name:of}",
]
timer_left = [
    "quanto manca",
    "quanto manca al timer",
    "quanto tempo manca",
    "quanto tempo rimane",
    "quanto manca alla fine del timer",
    "quanto manca {name:to}",
    "quanto manca per {name:the}",
    "quanto manca al timer {name:of}",
]
timer_list = ["che timer ho", "quali timer ho", "che timer ci sono", "quali timer ci sono", "quanti timer ho", "elenca i timer"]
alarm_set = [
    "metti la sveglia {time}",
    "metti una sveglia {time}",
    "imposta la sveglia {time}",
    "imposta una sveglia {time}",
    "svegliami {time}",
    "sveglia {time}",
]
alarm_cancel = ["annulla la sveglia", "togli la sveglia", "cancella la sveglia", "spegni la sveglia"]
volume_up = ["alza il volume", "alza", "più forte", "volume più alto"]
volume_down = ["abbassa il volume", "abbassa", "più piano", "volume più basso"]
volume_set = ["metti il volume al {percent}", "metti il volume a {percent}", "volume al {percent}", "volume a {percent}"]
volume_max = ["volume al massimo", "metti il volume al massimo"]
volume_min = ["volume al minimo", "metti il volume al minimo"]
music_pause = [
    "ferma la musica",
    "metti in pausa",
    "metti in pausa la musica",
    "metti pausa",
    "pausa",
    "spegni la musica",
    "interrompi la musica",
    "basta musica",
]
music_play = [
    "riprendi la musica",
    "fai ripartire la musica",
    "rimetti la musica",
    "continua la musica",
    "fai partire la musica",
    "riprendi",
]
music_next = [
    "prossima canzone",
    "canzone successiva",
    "passa alla prossima",
    "passa alla prossima canzone",
    "prossimo brano",
    "brano successivo",
    "salta questa canzone",
    "cambia canzone",
]
music_previous = [
    "canzone precedente",
    "brano precedente",
    "torna alla canzone di prima",
    "la canzone di prima",
    "rimetti la canzone di prima",
]
silence = ["silenzio", "stai zitto", "zitto", "lascia stare", "niente", "non importa", "annulla", "basta", "basta così", "no grazie", "niente grazie", "no", "grazie", "va bene così", "a posto così"]
repeat = ["ripeti", "puoi ripetere", "ripeti per favore", "cosa hai detto", "che cosa hai detto", "come hai detto", "ripetilo"]
screen_off = ["spegni lo schermo", "spegni il display", "spegni lo schermo per favore"]
dnd_on = [
    "non disturbare",
    "non disturbarmi",
    "attiva non disturbare",
    "attiva la modalità non disturbare",
    "modalità non disturbare",
    "non disturbare per {whole_duration}",
    "non disturbarmi per {whole_duration}",
    "attiva non disturbare per {whole_duration}",
]
dnd_morning = ["non disturbare fino a domattina", "non disturbarmi fino a domattina", "non disturbare fino a domani mattina"]
dnd_off = ["disattiva non disturbare", "disattiva la modalità non disturbare", "togli non disturbare", "spegni non disturbare"]
good_night = ["buonanotte", "buona notte"]

# The timers a name can be given by voice ("timer pasta dieci minuti"). A closed grammar takes no
# free words, so the names are a list; edit it freely (label = what the screen shows).
[timer_names]
Pasta = { bare = "pasta", the = "la pasta", of = "della pasta", to = "alla pasta" }
Uova = { bare = "uova", the = "le uova", of = "delle uova", to = "alle uova" }
Forno = { bare = "forno", the = "il forno", of = "del forno", to = "al forno" }
Pizza = { bare = "pizza", the = "la pizza", of = "della pizza", to = "alla pizza" }
Riso = { bare = "riso", the = "il riso", of = "del riso", to = "al riso" }
"Tè" = { bare = "tè", the = "il tè", of = "del tè", to = "al tè" }
"Caffè" = { bare = "caffè", the = "il caffè", of = "del caffè", to = "al caffè" }
Bucato = { bare = "bucato", the = "il bucato", of = "del bucato", to = "al bucato" }
Pane = { bare = "pane", the = "il pane", of = "del pane", to = "al pane" }
Torta = { bare = "torta", the = "la torta", of = "della torta", to = "alla torta" }
Carne = { bare = "carne", the = "la carne", of = "della carne", to = "alla carne" }
Verdure = { bare = "verdure", the = "le verdure", of = "delle verdure", to = "alle verdure" }
